image: ghcr.io/jethome-homeassistant/{arch}-hassio-supervisor
build_from:
  aarch64: ghcr.io/jethome-homeassistant/aarch64-base-python:3.13-alpine3.22-2025.11.1
  armhf: ghcr.io/jethome-homeassistant/armhf-base-python:3.13-alpine3.22-2025.11.1
  armv7: ghcr.io/jethome-homeassistant/armv7-base-python:3.13-alpine3.22-2025.11.1
  amd64: ghcr.io/jethome-homeassistant/amd64-base-python:3.13-alpine3.22-2025.11.1
  i386: ghcr.io/jethome-homeassistant/i386-base-python:3.13-alpine3.22-2025.11.1
cosign:
  base_identity: https://github.com/jethome-homeassistant/docker-base/.*
  identity: https://github.com/jethome-homeassistant/supervisor/.*
args:
  COSIGN_VERSION: 2.5.3
labels:
  io.hass.type: supervisor
  org.opencontainers.image.title: JH Home Assistant Supervisor
  org.opencontainers.image.description: Container-based system for managing Home Assistant Core installation
  org.opencontainers.image.source: https://github.com/jethome-homeassistant/supervisor
  org.opencontainers.image.authors: The Home Assistant Authors (JetHome patched)
  org.opencontainers.image.url: https://www.home-assistant.io/
  org.opencontainers.image.documentation: https://www.home-assistant.io/docs/
  org.opencontainers.image.licenses: Apache License 2.0
